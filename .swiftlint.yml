# SwiftLint configuration for Ichigo.
#
# Run locally with `swiftlint` from the repository root (see CONTRIBUTING.md).
# The thresholds below are tuned for a SwiftUI codebase, where declarative view
# bodies are legitimately long and the data models carry many fields.

included:
  - Sources
  - Tests

excluded:
  - Sources/AppModule/Resources

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - first_where
  - last_where
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - trailing_whitespace

line_length:
  warning: 160
  error: 220
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 900
  error: 1200
  ignore_comment_only_lines: true

function_body_length:
  warning: 90
  error: 140

identifier_name:
  min_length:
    warning: 1
  excluded:
    - id
    - r
    - w
    - d
    - f
    - s

cyclomatic_complexity:
  warning: 15
  error: 25
