# Builds and tests the Ichigo iOS app package.
#
# Ichigo is a SwiftUI iOS application defined as a Swift Playgrounds / Xcode app
# package (see Package.swift). Because its sources depend on the iOS SDK
# (SwiftUI / UIKit), it must be built with `xcodebuild` against an iOS Simulator
# destination — the plain `swift build` command targets the host platform and
# cannot compile UIKit.
#
# The simulator device / OS names below match the Xcode version pinned in the
# "Select Xcode" step; update them together if the runner image changes.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Structural checks that need no toolchain. They run on Linux in seconds and
  # give an exact filename for the two failure modes whose compiler diagnostics
  # are least actionable: an unbalanced brace (reported at end-of-file) and a
  # reference to a design token or view type that does not exist.
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check bracket balance
        run: python3 scripts/check_braces.py

      - name: Check symbol references
        run: python3 scripts/check_symbols.py

  build-and-test:
    name: Build & Test (iOS Simulator)
    needs: static-checks
    runs-on: macos-14

    env:
      SCHEME: Ichigo
      DESTINATION: "platform=iOS Simulator,name=iPhone 15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Environment
        run: |
          xcodebuild -version
          swift --version

      # The app is a single Swift Playgrounds-style target that carries `@main`,
      # which cannot be `@testable import`-ed by an XCTest target under xcodebuild,
      # so CI compiles the app (the meaningful gate) rather than running tests.
      # `-sdk iphonesimulator` pins the build to the iOS Simulator SDK; without it
      # xcodebuild can fall back to "My Mac", which fails on this iOS-only code.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
