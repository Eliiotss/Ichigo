name: Deploy web to GitHub Pages

# Publishes the static web app in web/ to GitHub Pages. Requires Pages to be
# enabled once in the repo: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Deploys on pushes that touch web/ (from main or the
# audit branch), and can also be run manually from the Actions tab.

on:
  push:
    branches:
      - main
      - claude/ichigo-production-audit-cprvp8
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Try to enable Pages (GitHub Actions source) automatically so no manual
          # Settings step is needed. If the token isn't allowed to, this fails and
          # Pages must be enabled once in Settings -> Pages -> Source: GitHub Actions.
          enablement: true
      - name: Upload web/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
